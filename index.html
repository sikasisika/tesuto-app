<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>特殊収容施設 - 囚人データベース</title>
    <style>
        :root {
            --bg-color: #121212;
            --panel-bg: #1e1e1e;
            --border-color: #333333;
            --accent-color: #8b0000;
            --text-main: #e0e0e0;
            --text-sub: #a0a0a0;
            --danger-color: #ff4d4d;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Courier New', Courier, monospace, sans-serif;
            margin: 0;
            padding: 20px;
        }
        header {
            border-bottom: 2px solid var(--accent-color);
            padding-bottom: 10px;
            margin-bottom: 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        h1 {
            font-size: 1.5rem;
            letter-spacing: 2px;
            color: var(--danger-color);
            margin: 0;
        }
        .container {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 20px;
        }
        .sidebar {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 15px;
            border-radius: 4px;
        }
        .sidebar h2 {
            font-size: 1rem;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 5px;
            margin-top: 0;
            color: var(--text-sub);
        }
        .prisoner-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .prisoner-item {
            padding: 10px;
            margin-bottom: 5px;
            background-color: #252525;
            border-left: 4px solid var(--accent-color);
            cursor: pointer;
            transition: background 0.2s;
        }
        .prisoner-item:hover {
            background-color: #303030;
        }
        .main-panel {
            background-color: var(--panel-bg);
            border: 1px solid var(--border-color);
            padding: 25px;
            border-radius: 4px;
            position: relative;
        }
        .confidential-stamp {
            position: absolute;
            top: 20px;
            right: 25px;
            border: 2px solid var(--danger-color);
            color: var(--danger-color);
            padding: 5px 15px;
            font-weight: bold;
            transform: rotate(5deg);
            opacity: 0.8;
            letter-spacing: 3px;
        }
        .profile-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-top: 20px;
        }
        .profile-group {
            background-color: #161616;
            border: 1px solid var(--border-color);
            padding: 12px;
            border-radius: 4px;
        }
        .profile-group.full {
            grid-column: span 2;
        }
        .label {
            font-size: 0.8rem;
            color: var(--text-sub);
            display: block;
            margin-bottom: 4px;
            text-transform: uppercase;
        }
        .value {
            font-size: 1rem;
            line-height: 1.4;
        }
        .secret-box {
            border-left: 3px solid var(--danger-color);
            background-color: #221212;
            padding: 10px;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <header>
        <h1>CLASSIFIED // PRISONER RECORD SYSTEM</h1>
        <div style="font-size: 0.8rem; color: var(--text-sub);">SECURITY LEVEL: RESTRICTED</div>
    </header>

    <div class="container">
        <div class="sidebar">
            <h2>収監者リスト</h2>
            <ul class="prisoner-list">
                <li class="prisoner-item">アリサ (ALISA)</li>
                <!-- 今後キャラを追加していく場所 -->
            </ul>
        </div>

        <div class="main-panel">
            <div class="confidential-stamp">極秘</div>
            <h2>囚人プロファイル</h2>
            
            <div class="profile-grid">
                <div class="profile-group">
                    <span class="label">氏名</span>
                    <span class="value">アリサ</span>
                </div>
                <div class="profile-group">
                    <span class="label">基本情報</span>
                    <span class="value">10代 / 人間 / 容姿端麗（本人無頓着）</span>
                </div>
                <div class="profile-group">
                    <span class="label">表向きの立場</span>
                    <span class="value">祖父の罪を被せられた無実の少女</span>
                </div>
                <div class="profile-group">
                    <span class="label">収監理由（自認）</span>
                    <span class="value">冤罪による不当投獄</span>
                </div>
                <div class="profile-group full">
                    <span class="label">【真の記録・裏設定】</span>
                    <div class="secret-box">
                        <span class="value">両親を殺害した後、その亡骸と数週間にわたって同じ家で過ごしていた精神異常者。現実逃避と強烈な思い込みにより、自らを「犠牲者」と思い込んでいる。周囲の凶悪犯に対しても無自覚に危うい狂気を見せる。</span>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
